name: React App

on:
  push:
    branches: [main, master]
    paths:
      - 'JS+React/link shortner/**'
      - '.github/workflows/react-app.yml'
  pull_request:
    paths:
      - 'JS+React/link shortner/**'
      - '.github/workflows/react-app.yml'

defaults:
  run:
    working-directory: 'JS+React/link shortner'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'JS+React/link shortner/yarn.lock'

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          VITE_BASE_PATH: /

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Build and start web service
        working-directory: 'JS+React/link shortner'
        run: |
          docker compose build web
          docker compose up -d web

      - name: Wait for healthy container
        working-directory: 'JS+React/link shortner'
        run: |
          for i in $(seq 1 30); do
            if docker compose ps web | grep -q healthy; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs web
          exit 1

      - name: Smoke test HTTP
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: Tear down
        if: always()
        working-directory: 'JS+React/link shortner'
        run: docker compose down -v

  deploy-pages:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'JS+React/link shortner/yarn.lock'

      - name: Install dependencies
        working-directory: 'JS+React/link shortner'
        run: corepack enable && yarn install --frozen-lockfile

      - name: Build for GitHub Pages
        working-directory: 'JS+React/link shortner'
        run: yarn build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add SPA fallback for GitHub Pages
        working-directory: 'JS+React/link shortner'
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'JS+React/link shortner/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
